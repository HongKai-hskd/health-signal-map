name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and route tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Initialize local D1
        run: npm run db:local:seed

      - name: Start local Worker
        run: |
          npm start > /tmp/pulse-worker.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pulse-worker.log
          exit 1

      - name: D1 HTTP smoke test
        run: npm run test:d1
